  .graph-wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-width:100%;touch-action:pan-x pan-y}

  .modal{width:100%;border-radius:19px 19px 0 0;max-height:calc(95dvh - env(safe-area-inset-top));height:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -15px 50px #0003}

  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(65px + env(safe-area-inset-bottom));padding:4px 3px env(safe-area-inset-bottom);background:rgba(255,253,248,.98);border-top:1px solid #e5d9cd;z-index:20;box-shadow:0 -6px 18px #251c170b;justify-content:space-between;backdrop-filter:blur(14px)}

  .mobile-tools{display:flex;position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:17;background:#fffdfa;border:1px solid #e4d8cf;box-shadow:0 5px 22px #3720171f;border-radius:12px;align-items:center;padding:5px;gap:5px;max-width:600px;margin:0 auto}
  .mobile-tools button{border:0;background:#f7efe9;color:#72534d;flex:1 1 0;height:42px;min-width:0;border-radius:8px;font-size:12px;font-weight:650;white-space:nowrap}
  .mobile-tools .mobile-tool-primary{background:var(--accent);color:white;flex:1.3}
  body:not(.is-scene) .mobile-tools{display:none}

  body.typing .mobile-done{display:block;position:fixed;right:12px;top:69px;z-index:19;border:1px solid #d9b9b0;background:#fff9f3;color:var(--accent);font-weight:650;font-size:13px;border-radius:9px;min-height:38px;padding:6px 13px;box-shadow:0 4px 18px #0002}
  body.typing .workspace{padding-bottom:30px}
  .mobile-menu-backdrop:not([hidden]){display:block;position:fixed;inset:0;z-index:28;background:#1714129c}
  .mobile-menu{display:block;position:fixed;z-index:29;left:0;right:0;bottom:0;background:#fffdfa;border-radius:20px 20px 0 0;max-height:min(87dvh,820px);overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 55px #0002;transform:translateY(110%);transition:transform .22s ease;visibility:hidden;overscroll-behavior:contain}
  .mobile-menu.open{transform:translateY(0);visibility:visible}
  .mobile-menu-handle{width:45px;height:5px;background:#d9cec2;border-radius:10px;margin:2px auto 15px}
  .mobile-menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .mobile-menu-head small{font-size:11px;color:var(--muted)}
  .mobile-menu-head h2{font:650 23px 'Noto Serif SC','Songti SC',serif}
  .menu-close{width:42px;height:42px;border:1px solid #e8e0d6;border-radius:12px;background:#f8f4ee}
  .mobile-menu-items{display:grid;grid-template-columns:1fr;gap:1px}
  .mobile-menu-items button{min-height:48px;border:0;border-bottom:1px solid #ece5dd;background:transparent;text-align:left;padding:9px 5px;display:flex;gap:13px;align-items:center;font-size:15px;color:var(--ink)}
  .mobile-menu-items button span{display:grid;place-items:center;width:27px;color:var(--accent);font-size:20px}
  .mobile-menu-items button b{margin-left:auto;color:#c2b8ad;font-size:20px;font-weight:400}
  .mobile-menu-disclaimer{font-size:12px;line-height:1.8;color:#897f74;background:#f8f3ec;border-radius:9px;padding:12px;margin-top:15px}
  .toast{left:50%;right:auto;bottom:calc(130px + env(safe-area-inset-bottom));max-width:85vw;text-align:center;transform:translateX(-50%);white-space:normal}
  body.typing .toast{bottom:12px}
  .notice{line-height:1.7}
  .mobile-backup{display:none}
}
@media(max-width:410px){
  .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .metric{padding:12px 9px;text-align:center}.metric strong{font-size:23px}.metric small{font-size:10px}
  .sidebar .project-box{width:58%}
  .mobile-tools button{font-size:11px}
}
@media(prefers-reduced-motion:reduce){.mobile-menu{transition:none}}
@media print{.mobile-nav,.mobile-tools,.mobile-menu,.mobile-menu-backdrop{display:none!important}}

.art-section{margin:18px 0;padding:12px 0;border-top:1px solid var(--line,#ded6ca)}.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-top:12px}.art-card{border:1px solid #ddd5c8;border-radius:9px;overflow:hidden;min-width:0;background:#fffdf8}.art-preview{width:100%;height:155px;display:grid;place-items:center;border:0;cursor:zoom-in;background:repeating-conic-gradient(#e9e5dd 0% 25%,#f9f7f2 0% 50%) 50% / 16px 16px;color:#776e63;font:inherit;padding:4px}.art-preview img{max-height:100%;max-width:100%;width:100%;height:100%;object-fit:contain}.art-preview [hidden]{display:none!important}.art-info{padding:10px;display:grid;gap:6px;overflow-wrap:anywhere}.art-info small,.art-info p{font-size:12px;color:#6f6258;margin:0;white-space:pre-wrap}.art-info .tag{justify-self:start}.art-viewer{position:fixed;inset:0;background:#181512ed;z-index:1000;display:flex;align-items:center;justify-content:center;padding:15px}.art-viewer img{max-height:90vh;max-width:94vw;object-fit:contain}.art-viewer button{position:absolute;top:15px;right:15px;z-index:1}@media(max-width:600px){.art-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art-preview{height:125px}}
</style>
<style id="mochangCloudStyleFix">@media(max-width:600px){.top-actions{gap:6px}.mo-cloud-btn{font-size:12px;padding:6px 9px}}</style>

<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">墨</div><div class="brandtext"><strong>墨场</strong><small>STORY WORKSPACE</small></div></div>
 <div class="project-box"><div class="side-label">当前作品</div><div class="project-row"><select id="projectSelect" aria-label="切换作品"></select><button class="btn project-add" data-action="new-project" title="新建作品">+</button></div></div>
 <nav class="nav" id="nav"></nav>
 <div class="sidebar-foot"><button data-action="export-json">↓ 备份项目 JSON</button><button data-action="import-json">↑ 导入备份 JSON</button><p>内容首先自动保存在本机；云端同步需在右上角登录 Supabase。仍建议定期导出备份。</p></div>
</aside>
<main class="workspace"><header class="topbar"><div><p class="overline" id="topOverline">STORY ATELIER</p><h1 id="topTitle">写作工作台</h1><p class="subtitle" id="topSubtitle">作品设定与剧本创作</p></div><div class="top-actions"><span class="save-state" id="saveState">● 已保存于此设备</span><button class="btn" data-action="export-md">导出全部内容</button><button class="btn primary" data-action="export-script">导出剧本文本</button></div></header><div id="content"></div></main>
</div>

<nav id="mobileNav" class="mobile-nav" aria-label="手机快捷导航">
  <button type="button" data-tab="scenes" class="mobile-tab" aria-label="写剧本"><span class="mobile-symbol">▤</span><span>写剧本</span></button>
  <button type="button" data-tab="characters" class="mobile-tab" aria-label="人物"><span class="mobile-symbol">♙</span><span>人物</span></button>
  <button type="button" data-tab="timeline" class="mobile-tab" aria-label="时间线"><span class="mobile-symbol">◷</span><span>时间线</span></button>
  <button type="button" data-tab="relations" class="mobile-tab" aria-label="关系网"><span class="mobile-symbol">◎</span><span>关系网</span></button>
  <button type="button" data-action="open-mobile-menu" class="mobile-tab mobile-tab-more" aria-label="更多功能"><span class="mobile-symbol">☰</span><span>更多</span></button>
</nav>
<div id="mobileTools" class="mobile-tools" aria-label="快速插入剧本内容">
  <button type="button" class="mobile-tool-primary" data-action="new-line" data-kind="dialogue">＋ 人物台词</button>
  <button type="button" data-action="new-line" data-kind="action">＋ 动作</button>
  <button type="button" data-action="new-line" data-kind="note">＋ 批注</button>
</div>
<button type="button" id="mobileDone" class="mobile-done" data-action="done-editing">完成编辑 ✓</button>
<div class="mobile-menu-backdrop" id="mobileMenuBackdrop" hidden></div>
<aside class="mobile-menu" id="mobileMenu" aria-label="更多功能" aria-hidden="true">
  <div class="mobile-menu-handle"></div>
  <div class="mobile-menu-head"><div><small>墨场 · 写作工作台</small><h2>更多功能</h2></div><button type="button" class="menu-close" data-action="close-mobile-menu" aria-label="关闭菜单">✕</button></div>
  <div class="mobile-menu-items">
    <button type="button" data-tab="overview"><span>◈</span> 作品概览 <b>›</b></button>
    <button type="button" data-tab="notes"><span>✎</span> 灵感与资料 <b>›</b></button>
    <button type="button" data-tab="artwork"><span>▧</span> 美术资源库 <b>›</b></button>
    <button type="button" data-action="new-project"><span>＋</span> 新建作品 <b>›</b></button>
    <button type="button" data-action="export-script"><span>↧</span> 导出剧本 Markdown <b>›</b></button>
    <button type="button" data-action="export-md"><span>↧</span> 导出完整设定 <b>›</b></button>
    <button type="button" data-action="export-json"><span>⤓</span> 备份所有作品 JSON <b>›</b></button>
    <button type="button" data-action="import-json"><span>⤒</span> 从 JSON 恢复作品 <b>›</b></button>
  </div>
  <p class="mobile-menu-disclaimer">墨场支持本机自动保存；在「云端账号与同步」中登录同一 Supabase 账号后，可在手机和电脑同步。重要作品仍建议定期导出备份。</p>
</aside>
<div id="modalCover" class="modal-cover" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle">编辑</h2><button class="btn icon ghost" type="button" data-action="close-modal" aria-label="关闭">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div><input id="fileInput" type="file" accept="application/json,.json" hidden />
<script src="./cloud.js?v=art1"></script>
<script>
(()=>{'use strict';
const KEY='mochang_writer_workspace_v1';const PALETTE=['#96535d','#727e8b','#7a856c','#987659','#776781','#4c8481','#9b6460','#666b91','#8c8057','#69856a'];
const NAV=[['overview','◈','作品概览'],['characters','♙','人物档案'],['scenes','▤','场景与剧本'],['timeline','◷','故事时间线'],['relations','◎','人物关系网'],['notes','✎','灵感与资料'],['artwork','▧','美术资源库']];
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>new Date().toISOString();const createProject=(name='未命名作品')=>({id:uid(),name,type:'原创剧本',logline:'',summary:'',characters:[],scenes:[],timeline:[],relations:[],notes:[],graphPositions:{},updatedAt:now()});
const defaultState=()=>{let p=createProject();return {version:1,projects:[p],activeProjectId:p.id,tab:'overview',selectedCharacterId:null,selectedSceneId:null,selectedNoteId:null,showCooccurrence:false}};
let state;try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):defaultState();if(!state?.projects?.length||!Array.isArray(state.projects))throw Error('invalid');}catch(e){state=defaultState()}
let modalContext=null,saveTimer=null,toastTimer=null;
const project=()=>state.projects.find(p=>p.id===state.activeProjectId)||state.projects[0];
function normalize(){for(const p of state.projects){for(const k of ['characters','scenes','timeline','relations','notes','artAssets'])if(!Array.isArray(p[k]))p[k]=[];p.graphPositions=p.graphPositions||{};for(const s of p.scenes){if(!Array.isArray(s.lines))s.lines=[];}}if(!state.projects.some(p=>p.id===state.activeProjectId))state.activeProjectId=state.projects[0].id;if(!NAV.some(n=>n[0]===state.tab))state.tab='overview'}normalize();
function persist(){const p=project();if(p)p.updatedAt=now();const el=$('#saveState');try{localStorage.setItem(KEY,JSON.stringify(state));el.textContent='● 已保存于此设备';window.MochangCloud?.queue(state)}catch(e){el.textContent='⚠ 保存失败，请导出备份';toast('本地存储空间不足，请尽快导出备份。')}}
function immediateSave(){clearTimeout(saveTimer);try{localStorage.setItem(KEY,JSON.stringify(state));$('#saveState').textContent='● 已保存于此设备';window.MochangCloud?.queue(state)}catch(e){toast('保存失败，请检查本地存储空间')}}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
function asDate(s){try{return new Date(s).toLocaleDateString('zh-CN')}catch{return '刚刚'}}
function truncate(s,n=70){s=String(s||'').replace(/\s+/g,' ');return s.length>n?s.slice(0,n)+'…':s}
const getPerson=(id)=>project().characters.find(x=>x.id===id),getScene=(id)=>project().scenes.find(x=>x.id===id),getNote=(id)=>project().notes.find(x=>x.id===id);
const personName=(id)=>getPerson(id)?.name||'未知人物';const sceneName=(id)=>getScene(id)?.title||'未关联场景';
const selected=(list,key)=>list.find(x=>x.id===state[key])||list[0];
function goto(tab,id){state.tab=tab;if(tab==='characters'&&id)state.selectedCharacterId=id;if(tab==='scenes'&&id)state.selectedSceneId=id;if(tab==='notes'&&id)state.selectedNoteId=id;render();persist()}
const btn=(label,action,extra='',attrs='')=>`<button type="button" class="btn ${extra}" data-action="${action}" ${attrs}>${label}</button>`;
const empty=(icon,title,desc,action,label)=>`<div class="panel empty"><div class="empty-ico">${icon}</div><h3>${title}</h3><p>${desc}</p>${action?btn(label,action,'primary'):''}</div>`;

function syncMobileLayout(){
  document.body.classList.toggle('is-scene',state.tab==='scenes');
  document.querySelectorAll('#mobileNav [data-tab]').forEach(b=>{
    const active=b.dataset.tab===state.tab;b.classList.toggle('active',active);
    if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  document.querySelector('#mobileNav .mobile-tab-more')?.classList.toggle('active', ['notes','overview','artwork'].includes(state.tab));
}
function closeMobileMenu(){
  const m=document.getElementById('mobileMenu');if(!m)return;
  m.classList.remove('open');m.setAttribute('aria-hidden','true');
  document.getElementById('mobileMenuBackdrop').hidden=true;
  document.body.classList.remove('menu-open');
}
function openMobileMenu(){
  const m=document.getElementById('mobileMenu');m.classList.add('open');m.setAttribute('aria-hidden','false');
  document.getElementById('mobileMenuBackdrop').hidden=false;
  document.body.classList.add('menu-open');
}

function render(){normalize();const p=project();$('#projectSelect').innerHTML=state.projects.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('');$('#nav').innerHTML=NAV.map(([tab,ico,name])=>`<button class="nav-btn ${state.tab===tab?'active':''}" data-tab="${tab}"><span><span class="nav-icon">${ico}</span>${name}</span><b>${tab==='characters'?p.characters.length:tab==='scenes'?p.scenes.length:tab==='timeline'?p.timeline.length:tab==='relations'?p.relations.length:tab==='notes'?p.notes.length:tab==='artwork'?p.artAssets.length:''}</b></button>`).join('');$('#topOverline').textContent=({overview:'PROJECT OVERVIEW',characters:'CHARACTER FILES',scenes:'SCRIPT WRITER',timeline:'STORY CHRONOLOGY',relations:'RELATIONSHIP MAP',notes:'IDEA NOTEBOOK',artwork:'ART ASSETS'})[state.tab];$('#topTitle').textContent=p.name;$('#topSubtitle').textContent=({overview:'从人物、场景与时间建立你的故事',characters:'人物动机、背景、秘密与档案',scenes:'逐场写作 · 选择人物说话',timeline:'按照故事发生的先后记录事件',relations:'明确关系与人物共场自动连线',notes:'零散想法、素材与创作笔记',artwork:'人物 · 场景 · 道具 · 家具 · 地图'})[state.tab];$('#content').innerHTML=({overview,characters,scenes,timeline,relations,notes,artwork})[state.tab]();if(state.tab==='relations')initGraphDrag();syncMobileLayout();refreshArtPreviews()}
function overview(){const p=project();const recentScenes=[...p.scenes].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,4);return `<div class="welcome panel"><div><div class="accent-line"></div><h2>${esc(p.name)}</h2><p>${p.logline?esc(p.logline):'一切从一个故事开始。先写下你想讲的故事，也可以直接创建人物或场景；这里没有预设时代、题材和剧情。'}</p><div class="buttons">${btn('＋ 新建场景','new-scene','primary')}${btn('＋ 新建人物','new-character')}${btn('编辑作品简介','edit-project')}${state.projects.length>1?btn('删除当前作品','delete-project','small danger'):''}</div></div><div class="muted-sm" style="flex:none;padding-top:7px">${esc(p.type||'原创剧本')}<br>更新于 ${asDate(p.updatedAt)}</div></div><div class="grid3" style="margin-bottom:16px"><div class="panel metric"><strong>${p.characters.length}</strong><small>已建立人物</small></div><div class="panel metric"><strong>${p.scenes.length}</strong><small>剧本场景</small></div><div class="panel metric"><strong>${p.timeline.length}</strong><small>故事时间节点</small></div></div><div class="grid2"><section class="panel panel-pad"><div class="section-head"><h3>最近创作的场景</h3><button class="text-btn" data-tab="scenes">全部场景</button></div>${recentScenes.length?`<div class="quicklist">${recentScenes.map(s=>`<button data-action="open-scene" data-id="${s.id}"><strong>${esc(s.title)}</strong><span class="muted-sm"> · ${s.lines.length}段内容 · ${esc(s.time||'时间未定')}</span></button>`).join('')}</div>`:'<p class="muted-sm">还没有场景。你可以直接开始写台词、动作和旁白。</p>'}</section><section class="panel panel-pad"><div class="section-head"><h3>作品构思</h3></div><div class="narrative">${p.summary?esc(p.summary):'<span class="muted">在作品设置中记录主题、世界观或创作意图。你也可以用「灵感与资料」保存更长的笔记。</span>'}</div><div class="divider"></div><div class="flexrow">${btn('编辑作品设定','edit-project','small')}${btn('打开灵感库','go-notes','small')}</div></section></div><div class="notice" style="margin-top:16px">作品会先自动保存在本机。要在手机与电脑同步，请点击右上角「☁ 云端」设置 Supabase 并登录同一账号；未登录时仍可以本地写作。建议定期导出 JSON 备份。</div><div style="margin-top:12px" class="flexrow mobile-backup">${btn('备份所有作品','export-json','small')}${btn('导入备份','import-json','small')}${btn('导出完整设定','export-md','small')}</div>`}
function characters(){const p=project();if(!p.characters.length)return `<div class="section-head"><div><h2>人物档案</h2><p>人物的秘密、目标与关系，由你自己决定。</p></div>${btn('＋ 添加人物','new-character','primary')}</div>${empty('♙','还没有人物','建立第一个人物后，你可以在场景里选择他 / 她说话，并在关系网中连接其他人物。','new-character','新建人物')}`;

function cooccurrence(){const p=project();const counts={};for(const s of p.scenes){const ids=[...new Set((s.lines||[]).filter(l=>l.type==='dialogue'&&l.speaker&&p.characters.some(c=>c.id===l.speaker)).map(l=>l.speaker))];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const key=[ids[i],ids[j]].sort().join('|');counts[key]=(counts[key]||0)+1}}return counts}
function relations(){const p=project();const links=p.relations;const cnt=cooccurrence();let graph='';if(!p.characters.length){graph=empty('◎','关系网还是空白','先创建人物，再建立他们之间的关系。写作过程中，人物同场出现的情况也可以自动生成虚线连接。','new-character','创建人物')}else{const n=p.characters.length;let coords={};p.characters.forEach((c,i)=>{let r=n>10?(i<n/2?205:285):n===1?0:n===2?170:245;let ring=n>10?(i<n/2?0:1):0;let idx=ring===0?i:i-Math.ceil(n/2);let size=n>10?(ring===0?Math.ceil(n/2):Math.floor(n/2)):n;let ang=-Math.PI/2+2*Math.PI*idx/size;coords[c.id]=p.graphPositions[c.id]||{x:500+r*Math.cos(ang),y:320+r*.87*Math.sin(ang)}});const explicit=new Set(links.map(r=>[r.from,r.to].sort().join('|')));const ghost=Object.entries(cnt).filter(([key])=>!explicit.has(key)).sort((a,b)=>b[1]-a[1]).slice(0,45);const co=state.showCooccurrence?ghost.map(([key,count])=>{const [a,b]=key.split('|');return graphEdge(a,b,coords,'#bac0be',true,`共场 ${count} 次`)}).join(''):'';const lines=links.filter(r=>coords[r.from]&&coords[r.to]).map(r=>graphEdge(r.from,r.to,coords,({positive:'#6e927e',negative:'#bf7779',mixed:'#9380a9',neutral:'#8797a0'})[r.type]||'#92857d',false,r.label||r.type)).join('');const nodes=p.characters.map((c,i)=>{const pos=coords[c.id];return `<g class="graph-node" data-nodeid="${c.id}" transform="translate(${pos.x},${pos.y})"><circle r="36" fill="${esc(c.color||PALETTE[i%PALETTE.length])}" opacity=".12" stroke="${esc(c.color||PALETTE[i%PALETTE.length])}" stroke-width="1"/><circle r="26" fill="${esc(c.color||PALETTE[i%PALETTE.length])}"/><text text-anchor="middle" dominant-baseline="central" y="0" fill="white" font-size="17" font-family="serif">${esc((c.name||'?').slice(0,1))}</text><text text-anchor="middle" y="54" fill="#413b37" font-size="15" font-weight="600">${esc(truncate(c.name,8))}</text><text text-anchor="middle" y="71" fill="#9d8b80" font-size="10">${esc(truncate(c.role,12))}</text></g>`}).join('');graph=`<div class="panel graph-panel"><div class="graph-wrap"><svg id="graphSvg" viewBox="0 0 1000 650" aria-label="人物关系网络图"><g id="graphEdges">${co}${lines}</g><g id="graphNodes">${nodes}</g></svg></div><div class="graph-legend"><span>实线：手动确认的关系　${state.showCooccurrence?'虚线：台词中同场出现（不等于真实关系）':''}</span><span>按住人物圆点可拖动布局 · 点击人物查看档案</span></div></div>`}return `<div class="section-head"><div><h2>人物关系网</h2><p>只把明确设置的关系当作正式关系；人物同场出现可作为辅助线索。</p></div><div class="section-actions">${btn('＋ 建立关系','new-relation','primary')}${btn(state.showCooccurrence?'隐藏共场虚线':'显示共场虚线','toggle-cooccurrence')}</div></div>${graph}<div class="section-head" style="margin-top:23px;margin-bottom:12px"><div><h3>已确认的关系 <span class="counter">${links.length}</span></h3></div></div>${links.length?`<div class="relation-cards">${links.map(r=>`<div class="panel relation-item"><div class="relation-title"><b>${esc(personName(r.from))} <span class="muted">—</span> ${esc(personName(r.to))}</b><span class="pill rel-${esc(r.type)}">${esc(r.label||({positive:'亲近',negative:'对立',mixed:'复杂',neutral:'普通'})[r.type])}</span></div><p>${esc(r.detail||'')}</p><div class="flexrow" style="margin-top:12px">${btn('编辑','edit-relation','small',`data-id="${r.id}"`)}${btn('删除','delete-relation','small danger',`data-id="${r.id}"`)}</div></div>`).join('')}</div>`:'<p class="muted-sm" style="margin:10px 0 16px">尚未添加明确的人物关系。人物仅在同一场戏出现，不会自动被判定为朋友、恋人或敌人。</p>'}`}
function graphEdge(a,b,coords,color,dashed,label){if(!coords[a]||!coords[b])return '';const A=coords[a],B=coords[b],mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dist=Math.hypot(A.x-B.x,A.y-B.y);if(dist<1)return '';const shortened=30/dist;const x1=A.x+(B.x-A.x)*shortened,y1=A.y+(B.y-A.y)*shortened,x2=B.x-(B.x-A.x)*shortened,y2=B.y-(B.y-A.y)*shortened;const text=label?`<g class="edge-caption" data-from="${a}" data-to="${b}"><rect x="${mx-String(label).length*6-8}" y="${my-12}" width="${String(label).length*12+16}" height="22" rx="9" fill="#fffdf8" opacity=".92"/><text x="${mx}" y="${my+3}" text-anchor="middle" font-size="11" fill="${color}">${esc(label)}</text></g>`:'';return `<g class="graph-edge" data-from="${a}" data-to="${b}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${dashed?1.5:2.7}" ${dashed?'stroke-dasharray="7,7"':''} opacity="${dashed?'.65':'.85'}"/>${text}</g>`}
function initGraphDrag(){const svg=$('#graphSvg');if(!svg)return;let drag=null,moved=false;const p=project();const getPoint=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())};const lookupCoord=(id)=>{const node=svg.querySelector(`.graph-node[data-nodeid="${id}"]`);const tr=node?.getAttribute('transform')||'';const mm=tr.match(/translate\(([-\d.]+),([-\d.]+)\)/);return mm?{x:+mm[1],y:+mm[2]}:{x:500,y:320}};svg.addEventListener('pointerdown',e=>{const node=e.target.closest('.graph-node');if(!node)return;const point=getPoint(e),current=lookupCoord(node.dataset.nodeid);drag={id:node.dataset.nodeid,dx:current.x-point.x,dy:current.y-point.y,startX:point.x,startY:point.y};moved=false;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const pt=getPoint(e);if(Math.hypot(pt.x-drag.startX,pt.y-drag.startY)>5)moved=true;const pos={x:Math.max(52,Math.min(948,pt.x+drag.dx)),y:Math.max(54,Math.min(579,pt.y+drag.dy))};p.graphPositions[drag.id]=pos;const node=svg.querySelector(`.graph-node[data-nodeid="${drag.id}"]`);if(node)node.setAttribute('transform',`translate(${pos.x},${pos.y})`);svg.querySelectorAll(`.graph-edge[data-from="${drag.id}"],.graph-edge[data-to="${drag.id}"]`).forEach(g=>{const a=g.dataset.from,b=g.dataset.to,A=lookupCoord(a),B=lookupCoord(b),len=Math.hypot(B.x-A.x,B.y-A.y)||1,t=30/len;const ln=g.querySelector('line');ln.setAttribute('x1',A.x+(B.x-A.x)*t);ln.setAttribute('y1',A.y+(B.y-A.y)*t);ln.setAttribute('x2',B.x-(B.x-A.x)*t);ln.setAttribute('y2',B.y-(B.y-A.y)*t);const caption=g.querySelector('.edge-caption');if(caption){const mid=(A.x+B.x)/2,midy=(A.y+B.y)/2,rect=caption.querySelector('rect'),txt=caption.querySelector('text');rect.setAttribute('x',mid-parseFloat(rect.getAttribute('width'))/2);rect.setAttribute('y',midy-12);txt.setAttribute('x',mid);txt.setAttribute('y',midy+3)}})});svg.addEventListener('pointerup',()=>{if(!drag)return;const id=drag.id;drag=null;persist();if(!moved)goto('characters',id)});svg.addEventListener('pointercancel',()=>{drag=null});}
function notes(){const p=project();if(!p.notes.length)return `<div class="section-head"><div><h2>灵感与资料</h2><p>故事主题、历史资料、未成形的想法，都可以记录在这里。</p></div>${btn('＋ 新建笔记','new-note','primary')}</div>${empty('✎','从一个念头开始','这里没有固定格式。你可以写人物独白、情节片段、场景意象或资料摘记。','new-note','新建笔记')}`;const note=selected(p.notes,'selectedNoteId');return `<div class="section-head"><div><h2>灵感与资料</h2><p>不必整理成熟，先把想法留下。</p></div>${btn('＋ 新建笔记','new-note','primary')}</div><div class="split"><div class="panel side-list">${p.notes.map(n=>`<button class="side-list-item ${n.id===note.id?'active':''}" data-action="open-note" data-id="${n.id}"><strong>${esc(n.title)}</strong><small>${esc(truncate(n.body,39)||'空白笔记')}</small></button>`).join('')}</div><div class="panel panel-pad note-editor"><div class="flexrow" style="justify-content:space-between;margin-bottom:12px"><span class="note-date">最后编辑：${asDate(note.updatedAt)}</span>${btn('删除笔记','delete-note','small danger',`data-id="${note.id}"`)}</div><input id="noteTitle" aria-label="笔记标题" value="${esc(note.title)}" placeholder="笔记标题"><textarea id="noteBody" aria-label="笔记内容" placeholder="从这里开始写下你的想法……">${esc(note.body||'')}</textarea></div></div>`}

function modalScene(id){const s=id?getScene(id):{};if(!s)return;openModal(id?'编辑场景信息':'新建场景','scene',id,field('title','场景名称',s.title||'')+field('act','幕 / 章 / 章节',s.act||'')+field('time','故事时间（自由填写）',s.time||'','','', '如：1934年冬夜 / 第三天凌晨')+field('place','场景地点',s.place||'')+field('summary','本场发生什么（可选）',s.summary||'','textarea',true)+field('appearance','场景外观描述',s.appearance||'','textarea',true))}
function modalEvent(id){const e=id?project().timeline.find(x=>x.id===id):{};if(!e)return;const order=e.order??(project().timeline.length+1)*10;openModal(id?'编辑时间节点':'添加时间节点','event',id,field('title','事件标题',e.title||'')+field('when','发生时间',e.when||'','',false,'如：1934年秋 / 五年前 / 第十日')+field('order','排序编号（越小越早）',order,'number')+`<div class="field"><label class="labelled">关联剧本场景（可选）</label><select name="sceneId"><option value="">无</option>${project().scenes.map(s=>`<option value="${s.id}" ${s.id===e.sceneId?'selected':''}>${esc(s.title)}</option>`).join('')}</select></div>`+field('description','事件内容与影响',e.description||'','textarea',true)+`<div class="field span2"><label class="labelled">相关人物（可选）</label><div class="check-grid">${project().characters.length?project().characters.map(c=>`<label><input type="checkbox" name="people" value="${c.id}" ${(e.people||[]).includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join(''):'<span class="muted-sm">还没有人物</span>'}</div></div>`)}
function modalRelation(id){const r=id?project().relations.find(x=>x.id===id):{};if(!r)return;if(project().characters.length<2){toast('至少建立两个人物，才能添加关系');goto('characters');return}openModal(id?'编辑人物关系':'建立人物关系','relation',id,`<div class="field"><label class="labelled">人物甲</label><select name="from" required>${optionsForPeople(r.from||project().characters[0].id)}</select></div><div class="field"><label class="labelled">人物乙</label><select name="to" required>${optionsForPeople(r.to||project().characters[1].id)}</select></div><div class="field"><label class="labelled">关系类型</label><select name="type">${[['positive','亲近 / 友好'],['negative','敌对 / 冲突'],['mixed','复杂 / 矛盾'],['neutral','中性 / 普通']].map(([val,label])=>`<option value="${val}" ${r.type===val?'selected':''}>${label}</option>`).join('')}</select></div>`+field('label','关系名称（自定义）',r.label||'','','', '如：旧恋人 / 师徒 / 竞争对手')+field('detail','关系经过 / 双方认知',r.detail||'','textarea',true))}
function modalNote(){openModal('新建笔记','note',null,field('title','笔记标题',''))}
function modalSave(e){e.preventDefault();if(!modalContext)return;if(modalContext.mode==='art'){saveArt(e.target,modalContext.id);return;}const {mode,id}=modalContext,form=e.target,data=new FormData(form),val=x=>String(data.get(x)||'').trim(),p=project();if((mode==='project'||mode==='character'||mode==='scene'||mode==='event'||mode==='note')&&!val(mode==='project'||mode==='character'?'name':'title')){toast('请填写名称或标题');return}
if(mode==='project'){const info={name:val('name'),type:val('type'),logline:val('logline'),summary:val('summary')};if(id)Object.assign(p,info);else{const fresh=createProject(info.name);Object.assign(fresh,info);state.projects.push(fresh);state.activeProjectId=fresh.id;state.tab='overview';state.selectedCharacterId=null;state.selectedSceneId=null;state.selectedNoteId=null}}
if(mode==='character'){const info={name:val('name'),role:val('role'),tags:val('tags'),background:val('background'),personality:val('personality'),appearance:val('appearance'),desire:val('desire'),secret:val('secret'),notes:val('notes'),color:val('color')||PALETTE[0]};if(id)Object.assign(getPerson(id),info);else{const x={id:uid(),...info};p.characters.push(x);state.selectedCharacterId=x.id;state.tab='characters'}}
if(mode==='scene'){const info={title:val('title'),act:val('act'),time:val('time'),place:val('place'),summary:val('summary'),appearance:val('appearance'),updatedAt:now()};if(id)Object.assign(getScene(id),info);else{const x={id:uid(),...info,order:(Math.max(0,...p.scenes.map(x=>x.order||0))+10),lines:[]};p.scenes.push(x);state.selectedSceneId=x.id;state.tab='scenes'}}
if(mode==='event'){const info={title:val('title'),when:val('when'),order:Number(data.get('order'))||10,description:val('description'),sceneId:val('sceneId'),people:data.getAll('people')};if(id)Object.assign(p.timeline.find(x=>x.id===id),info);else{p.timeline.push({id:uid(),...info});state.tab='timeline'}}
if(mode==='relation'){let from=val('from'),to=val('to');if(from===to){toast('不能将人物与自己建立为两个人物之间的关系');return}if(p.relations.some(r=>r.id!==id&&[r.from,r.to].sort().join('|')===[from,to].sort().join('|'))){toast('这两个人物已有关系，请直接编辑');return}const info={from,to,type:val('type'),label:val('label'),detail:val('detail')};if(id)Object.assign(p.relations.find(r=>r.id===id),info);else{p.relations.push({id:uid(),...info});state.tab='relations'}}
if(mode==='note'){const x={id:uid(),title:val('title'),body:'',updatedAt:now()};p.notes.unshift(x);state.selectedNoteId=x.id;state.tab='notes'}
closeModal();render();persist();toast('已保存')}
function closeModal(){modalContext=null;$('#modalCover').classList.remove('open')}
function reorder(list,id,delta){list.sort((a,b)=>a.order-b.order);const i=list.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];list.forEach((x,k)=>x.order=(k+1)*10)}
function confirmDelete(text){return confirm(text+'？此操作无法撤销，请确保已备份。')}
function removeCharacter(id){const p=project();if(!confirmDelete('确定删除人物「'+personName(id)+'」吗？该人物在台词中将变成“选择人物”，关联关系也会删除'))return;p.characters=p.characters.filter(c=>c.id!==id);p.relations=p.relations.filter(r=>r.from!==id&&r.to!==id);p.timeline.forEach(e=>e.people=(e.people||[]).filter(x=>x!==id));p.scenes.forEach(s=>s.lines.forEach(l=>{if(l.speaker===id)l.speaker=''}));delete p.graphPositions[id];state.selectedCharacterId=p.characters[0]?.id;render();persist()}
function removeScene(id){const p=project();if(!confirmDelete('确定删除场景「'+sceneName(id)+'」及其中的全部台词'))return;p.scenes=p.scenes.filter(s=>s.id!==id);p.timeline.forEach(e=>{if(e.sceneId===id)e.sceneId=''});state.selectedSceneId=p.scenes[0]?.id;render();persist()}
function removeRelation(id){project().relations=project().relations.filter(x=>x.id!==id);render();persist()}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.replace(/[\\/:*?"<>|]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const mdEscape=s=>String(s||'').replace(/\r/g,'').replace(/([\\`*_{}\[\]<>])/g,'\\$1');
function exportText(full=false){const p=project(),sc=[...p.scenes].sort((a,b)=>a.order-b.order);let out=`# ${p.name}\n\n`;if(full){out+=`类型：${p.type||''}\n\n${p.logline||''}\n\n${p.summary||''}\n\n## 人物档案\n\n`;for(const c of p.characters){out+=`### ${c.name}\n\n身份：${c.role||''}\n\n背景：${c.background||''}\n\n性格：${c.personality||''}\n\n人物形象：${c.appearance||''}\n\n目标：${c.desire||''}\n\n秘密：${c.secret||''}\n\n备注：${c.notes||''}\n\n`}out+='## 人物关系\n\n';for(const r of p.relations)out+=`- ${personName(r.from)} — ${personName(r.to)}：${r.label||r.type}${r.detail?'；'+r.detail:''}\n`;out+='\n## 故事时间线\n\n';for(const e of [...p.timeline].sort((a,b)=>a.order-b.order))out+=`- ${e.when||'时间未定'}｜${e.title}${e.description?'：'+e.description:''}${e.people?.length?' [相关人物：'+e.people.map(personName).join('、')+']':''}\n`;out+='\n## 剧本正文\n\n'}
for(const [i,s] of sc.entries()){out+=`## ${i+1}. ${s.title}\n\n`;const info=[s.act,s.time,s.place].filter(Boolean).join(' · ');if(info)out+=`${info}\n\n`;if(s.summary&&full)out+=`> 本场梗概：${s.summary.replace(/\n/g,' ')}\n\n`;for(const l of s.lines){if(!l.text?.trim())continue;if(l.type==='dialogue')out+=`**${l.speaker?personName(l.speaker):'未指定人物'}：** ${l.text}\n\n`;else if(l.type==='action')out+=`*${l.text}*\n\n`;else if(full)out+=`> 【创作批注】${l.text.replace(/\n/g,'\n> ')}\n\n`}}
if(full){out+='\n## 灵感与资料\n\n';for(const n of p.notes)out+=`### ${n.title}\n\n${n.body||''}\n\n`}return out}
function exportJSON(){immediateSave();download('墨场_全部作品备份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'墨场',version:1,exportedAt:now(),data:state},null,2),'application/json;charset=utf-8');toast('已导出可恢复的完整备份')}
function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);const next=obj.data||obj;if(!Array.isArray(next.projects)||!next.projects.length||!next.projects.every(p=>p&&typeof p.id==='string'&&Array.isArray(p.characters)&&Array.isArray(p.scenes)))throw Error('格式不正确');if(!confirm('导入备份将替换当前工作台中的全部作品。确认已备份当前内容并继续吗？'))return;state=next;normalize();state.tab='overview';render();immediateSave();toast('导入成功')}catch(e){alert('导入失败：这不是有效的墨场备份文件。\n'+e.message)}finally{$('#fileInput').value=''}};reader.onerror=()=>toast('无法读取文件');reader.readAsText(file,'UTF-8')}
function clickAction(e){const tab=e.target.closest('[data-tab]');if(tab){closeMobileMenu();goto(tab.dataset.tab);return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(action==='open-mobile-menu'){openMobileMenu();return}if(action==='close-mobile-menu'){closeMobileMenu();return}if(action==='done-editing'){document.activeElement?.blur();document.body.classList.remove('typing');return}closeMobileMenu();const p=project();switch(action){case 'new-project':modalProject();break;case 'edit-project':modalProject(p.id);break;case 'delete-project':if(state.projects.length===1){toast('至少保留一个作品');break}if(confirmDelete('确定删除当前作品「'+p.name+'」及全部内容')){state.projects=state.projects.filter(x=>x.id!==p.id);state.activeProjectId=state.projects[0].id;state.tab='overview';render();persist()}break;
case 'art-add':modalArt();break;case 'art-edit':modalArt(id);break;case 'art-view':openArt(id,false);break;case 'art-download':openArt(id,true);break;case 'art-remove':if(confirm('从档案移除此图片？原图仍保留在私人云端，以免旧备份失效。')){p.artAssets=p.artAssets.filter(a=>a.id!==id);render();persist()}break;case 'new-character':modalCharacter();break;case 'edit-character':modalCharacter(id||selected(p.characters,'selectedCharacterId')?.id);break;case 'delete-character':removeCharacter(id);break;case 'open-character':goto('characters',id);break;
case 'new-scene':modalScene();break;case 'edit-scene':modalScene(id||selected(p.scenes,'selectedSceneId')?.id);break;case 'delete-scene':removeScene(id);break;case 'open-scene':goto('scenes',id);break;case 'move-scene':reorder(p.scenes,id,Number(b.dataset.delta));render();persist();break;
case 'new-line':{const s=selected(p.scenes,'selectedSceneId');if(!s)break;const line={id:uid(),type:b.dataset.kind||'dialogue',speaker:p.characters[0]?.id||'',text:''};s.lines.push(line);s.updatedAt=now();render();persist();const ta=$(`[data-line="${line.id}"][data-line-field="text"]`);ta?.focus();ta?.scrollIntoView({block:'center',behavior:'instant'});break}
case 'move-line':{const s=selected(p.scenes,'selectedSceneId');const i=s.lines.findIndex(x=>x.id===id),j=i+Number(b.dataset.delta);if(i>=0&&j>=0&&j<s.lines.length){[s.lines[i],s.lines[j]]=[s.lines[j],s.lines[i]];s.updatedAt=now();render();persist()}break}
case 'delete-line':{const s=selected(p.scenes,'selectedSceneId');const l=s.lines.find(x=>x.id===id);if(l?.text?.trim()&&!confirm('确定删除这段已写内容吗？'))break;s.lines=s.lines.filter(x=>x.id!==id);s.updatedAt=now();render();persist();break}
case 'new-event':modalEvent();break;case 'edit-event':modalEvent(id);break;case 'delete-event':if(confirmDelete('确定删除此时间节点')){p.timeline=p.timeline.filter(x=>x.id!==id);render();persist()}break;case 'move-event':reorder(p.timeline,id,Number(b.dataset.delta));render();persist();break;
case 'new-relation':modalRelation();break;case 'edit-relation':modalRelation(id);break;case 'delete-relation':if(confirm('删除这条人物关系吗？'))removeRelation(id);break;case 'toggle-cooccurrence':state.showCooccurrence=!state.showCooccurrence;render();persist();break;case 'go-relation':goto('relations');break;
case 'new-note':modalNote();break;case 'open-note':goto('notes',id);break;case 'delete-note':{const n=getNote(id);if(confirmDelete('确定删除笔记「'+n?.title+'」')){p.notes=p.notes.filter(x=>x.id!==id);state.selectedNoteId=p.notes[0]?.id;render();persist()}break}case 'go-notes':goto('notes');break;
case 'export-json':exportJSON();break;case 'import-json':$('#fileInput').click();break;case 'export-md':download(p.name+'_完整设定与剧本.md',exportText(true),'text/markdown;charset=utf-8');toast('已导出全部内容');break;case 'export-script':download(p.name+'_剧本.md',exportText(false),'text/markdown;charset=utf-8');toast('已导出剧本正文');break;case 'close-modal':closeModal();break}}

$('#modalCover').addEventListener('click',e=>{if(e.target.id==='modalCover')closeModal()});$('#fileInput').addEventListener('change',e=>importJSON(e.target.files?.[0]));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalCover').classList.contains('open'))closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.matches('textarea[data-line-field=text]')){e.preventDefault();const s=selected(project().scenes,'selectedSceneId');const i=s.lines.findIndex(x=>x.id===e.target.dataset.line);if(i>=0){const old=s.lines[i],line={id:uid(),type:old.type==='note'?'note':old.type==='action'?'action':'dialogue',speaker:old.speaker||'',text:''};s.lines.splice(i+1,0,line);s.updatedAt=now();render();persist();const ta=$(`[data-line="${line.id}"][data-line-field=text]`);ta?.focus();ta?.scrollIntoView({block:'center',behavior:'instant'})}return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();immediateSave();toast('已保存到本机；登录后将自动同步云端')}});window.addEventListener('beforeunload',immediateSave);

let artUrls=[], artModalBusy=false;
function artScope(){const p=project();if(state.tab==='characters')return {kind:'character',id:selected(p.characters,'selectedCharacterId')?.id||''};if(state.tab==='scenes')return {kind:'scene',id:selected(p.scenes,'selectedSceneId')?.id||''};return {kind:'project',id:''}}
function artOwner(a){return a.kind==='character'?(getPerson(a.ownerId)?.name||'原关联人物已删除'):a.kind==='scene'?(getScene(a.ownerId)?.title||'原关联场景已删除'):'作品素材'}
function artGallery(kind,id){const all=project().artAssets||[], list=kind==='all'?all:all.filter(a=>a.kind===kind&&a.ownerId===id);return '<section class="art-section"><div class="flexrow" style="justify-content:space-between"><h3>'+(kind==='character'?'人物立绘与参考图':kind==='scene'?'场景图片':'全部美术资源')+' · '+list.length+'</h3>'+btn('＋ 上传图片','art-add','small primary')+'</div><p class="muted-sm">支持多图、原图保存及备注。图片保存在私人云端，需联网登录同一账号。</p>'+(list.length?'<div class="art-grid">'+list.map(a=>'<article class="art-card"><button type="button" class="art-preview" data-action="art-view" data-id="'+esc(a.id)+'"><img alt="'+esc(a.name||a.category)+'" data-art-path="'+esc(a.path)+'" hidden><span>加载图片…</span></button><div class="art-info"><span class="tag">'+esc(a.category)+'</span><strong>'+esc(a.name||a.filename||'未命名图片')+'</strong><small>'+esc(artOwner(a))+'</small>'+(a.description?'<p>'+esc(a.description)+'</p>':'')+(a.purpose?'<p>用途：'+esc(a.purpose)+'</p>':'')+(a.location?'<p>所属地点：'+esc(a.location)+'</p>':'')+'<div class="flexrow">'+btn('下载','art-download','small','data-id="'+esc(a.id)+'"')+btn('编辑','art-edit','small','data-id="'+esc(a.id)+'"')+btn('移除','art-remove','small danger','data-id="'+esc(a.id)+'"')+'</div></div></article>').join('')+'</div>':'<div class="notice" style="margin-top:10px">还没有图片，可以上传 PNG、JPG、WebP、GIF 或 AVIF。</div>')+'</section>'}
function artwork(){return '<div class="section-head"><div><h2>美术资源库</h2><p>集中管理人物立绘、场景图、道具、家具、地图和参考素材。</p></div></div><div class="panel panel-pad">'+artGallery('all','')+'<p class="muted-sm">人物和场景的图片请在对应档案上传；本页直接上传道具、家具、地图或其他参考图。JSON 备份记录图片关联，原图请单独下载。</p></div>'}
function refreshArtPreviews(){for(const u of artUrls)URL.revokeObjectURL(u);artUrls=[];document.querySelectorAll('img[data-art-path]').forEach(async img=>{const label=img.nextElementSibling;try{const blob=await window.MochangCloud.artRead(img.dataset.artPath);if(!img.isConnected)return;const url=URL.createObjectURL(blob);artUrls.push(url);img.onload=()=>{img.hidden=false;label.hidden=true};img.onerror=()=>{label.textContent='图片无法显示';img.hidden=true};img.src=url}catch(e){if(img.isConnected)label.textContent='图片暂不可用 · 请登录并联网'}})}
function modalArt(id){const a=id?project().artAssets.find(x=>x.id===id):null;if(id&&!a)return;const scope=a?{kind:a.kind,id:a.ownerId}:artScope();const kind=ART_TYPES[scope.kind]?scope.kind:'project';openModal(a?'编辑美术资源':'上传美术资源','art',id,'<div class="field span2"><label class="labelled">图片类别</label><select name="category">'+ART_TYPES[kind].map(t=>'<option '+(a?.category===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>'+field('artName','图片 / 物件名称（留空使用文件名）',a?.name||'','',true)+field('description','外观描述 / 备注',a?.description||'','textarea',true)+field('purpose','剧情用途 / 版本说明',a?.purpose||'','textarea',true)+field('location','所属地点（可选）',a?.location||'','',true)+(a?'':'<div class="field span2"><label class="labelled">选择图片（可多选，单张不超过20MB）</label><input name="artFiles" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" multiple required><p class="muted-sm">保留原始文件，不压缩、不改变透明背景。图片会上传到私人云端。</p></div>')+'<input type="hidden" name="artKind" value="'+esc(kind)+'"><input type="hidden" name="artOwner" value="'+esc(scope.id||'')+'">')}
async function saveArt(form,id){if(artModalBusy)return;const p=project(),data=new FormData(form),val=k=>String(data.get(k)||'').trim(),kind=val('artKind'),ownerId=val('artOwner'),category=val('category');if(!ART_TYPES[kind]?.includes(category))return;const info={category,description:val('description'),purpose:val('purpose'),location:val('location')};if(id){const a=p.artAssets.find(x=>x.id===id);if(!a)return;Object.assign(a,info,{name:val('artName')||a.filename});closeModal();render();persist();return}
const files=data.getAll('artFiles').filter(f=>f instanceof File&&f.size);if(!files.length){toast('请先选择图片');return}if(files.some(f=>!ART_MIME.includes(f.type)||f.size>20971520)){toast('请选择支持的图片格式，每张不超过20MB');return}
if(!window.MochangCloud?.artReady()){toast('请先登录云端账号并完成同步');return}
artModalBusy=true;const submit=form.querySelector('[type=submit]');submit.disabled=true;const old=submit.textContent;let done=0;try{for(const f of files){submit.textContent='上传 '+(done+1)+' / '+files.length;const path=await window.MochangCloud.artUpload(f);if(project()!==p||!window.MochangCloud.artReady())throw Error('作品或登录状态已改变，请重新打开档案');p.artAssets.push({id:uid(),kind,ownerId,...info,name:val('artName')?(files.length>1?val('artName')+' · '+f.name:val('artName')):f.name,filename:f.name,path,mime:f.type,size:f.size,createdAt:now()});done++;persist()}closeModal();render();toast('已上传 '+done+' 张图片')}catch(e){alert('已成功上传 '+done+' 张；其余未完成：'+e.message);closeModal();render()}finally{artModalBusy=false;submit.disabled=false;submit.textContent=old}}
async function openArt(id,downloadFile){const a=project().artAssets.find(x=>x.id===id);if(!a)return;try{const blob=await window.MochangCloud.artRead(a.path);const url=URL.createObjectURL(blob);if(downloadFile){const link=document.createElement('a');link.href=url;link.download=a.filename||a.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);return}const overlay=document.createElement('div');overlay.className='art-viewer';const close=()=>{overlay.remove();URL.revokeObjectURL(url);document.removeEventListener('keydown',onKey)};const onKey=e=>{if(e.key==='Escape')close()};const img=document.createElement('img');img.src=url;img.alt=a.name;const x=document.createElement('button');x.type='button';x.textContent='关闭 ×';x.className='btn';x.onclick=close;overlay.append(x,img);overlay.onclick=e=>{if(e.target===overlay)close()};document.body.append(overlay);document.addEventListener('keydown',onKey)}catch(e){toast('图片读取失败：'+e.message)}}

render();immediateSave();
window.MochangCloud?.init({
  read:()=>state,
  blank:defaultState,
  apply:(incoming)=>{
    state=incoming;normalize();render();
    try{localStorage.setItem(KEY,JSON.stringify(state));$('#saveState').textContent='● 已保存于此设备'}
    catch(e){toast('本机保存失败，请导出备份')}
  }
});
})();
</script>

if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
