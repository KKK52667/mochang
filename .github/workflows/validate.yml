name: Validate Mochang static scripts
on:
  push:
    paths:
      - 'index.html'
      - 'cloud.js'
      - 'sw.js'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check cloud and service worker syntax
        run: |
          node --check cloud.js
          node --check sw.js
      - name: Check HTML inline scripts and required assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf8')
          assert '<script src="./cloud.js"></script>' in html
          assert 'MochangCloud?.init' in html
          for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html),1):
              if script.strip():
                  p=Path(f'/tmp/mochang-inline-{i}.js')
                  p.write_text(script,encoding='utf8')
                  subprocess.run(['node','--check',str(p)],check=True)
          for name in ('cloud.js','sw.js','icon.svg','manifest.webmanifest','supabase/schema.sql'):
              assert Path(name).is_file(),name
          print('HTML scripts and required files: PASS')
          PY